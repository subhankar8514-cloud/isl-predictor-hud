name: Update league data

# Refreshes data/isl.json, data/epl.json and data/laliga.json once a day.
# Secrets: GOAL_API_KEY
# Variables: ISL_LEAGUE_ID (optional, has a default), EPL_LEAGUE_ID, LALIGA_LEAGUE_ID

on:
  schedule:
    - cron: '0 21 * * *'      # 21:00 UTC = 02:30 IST
  workflow_dispatch:
    inputs:
      source:
        description: 'Data source (goal = your API key, thesportsdb = free fallback)'
        required: false
        default: 'goal'
      list_leagues:
        description: 'Type yes to only print the league ids on your account'
        required: false
        default: 'no'
  push:
    paths:
      - 'scripts/update_data.py'
      - '.github/workflows/update-isl.yml'

permissions:
  contents: write

concurrency:
  group: league-data-update
  cancel-in-progress: true

jobs:
  # Optional helper: searches your API for league ids.
  # Run with list_leagues = yes (default filter) or with a term, e.g. "premier" or "la liga".
  discover:
    if: github.event.inputs.list_leagues != 'no'
    runs-on: ubuntu-latest
    steps:
      - name: Search leagues
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          TERM: ${{ github.event.inputs.list_leagues }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          key = os.environ.get("GOAL_API_KEY", "")
          term = (os.environ.get("TERM") or "yes").strip().lower()
          if not key:
              raise SystemExit("GOAL_API_KEY secret is missing")
          pattern = "premier|la liga|laliga|primera|super league|indian super" if term in ("yes", "true", "") else term
          rx = re.compile(pattern)
          found, offset = [], 0
          while offset < 5000:
              url = f"https://api.goal-api.com/v1/leagues?limit=100&offset={offset}"
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + key, "Accept": "application/json"})
              data = json.loads(urllib.request.urlopen(req, timeout=45).read().decode())
              rows = data if isinstance(data, list) else (data.get("data") or data.get("leagues") or [])
              if not rows:
                  break
              for r in rows:
                  country = r.get("country")
                  cname = country.get("name") if isinstance(country, dict) else (country or "")
                  label = f"{r.get('name','')} {cname}"
                  if rx.search(label.lower()):
                      found.append(f"{r.get('id')}  {r.get('name')}  [{cname}]")
              if len(rows) < 100:
                  break
              offset += 100
          print("\n".join(found) if found else f"No league matched '{pattern}'")
          print(f"\n{len(found)} match(es) for /{pattern}/")
          PY

  refresh:
    if: github.event.inputs.list_leagues != 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch fixtures and results for every league
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          ISL_ID: ${{ vars.ISL_LEAGUE_ID || 'cmr77dvry008arx06q35z3h2m' }}
          EPL_ID: ${{ vars.EPL_LEAGUE_ID }}
          LALIGA_ID: ${{ vars.LALIGA_LEAGUE_ID }}
          DATA_SOURCE: ${{ github.event.inputs.source || 'goal' }}
        run: |
          fetch() {
            name="$1"; id="$2"
            if [ -z "$id" ]; then
              echo "::notice::No league id set for $name - skipping"
              return 0
            fi
            echo "== $name ($id)"
            LEAGUE_ID="$id" OUT_PATH="data/$name.json" python3 scripts/update_data.py \
              || echo "::warning::$name failed this run, keeping the previous file"
          }
          fetch isl "$ISL_ID"
          fetch epl "$EPL_ID"
          fetch laliga "$LALIGA_ID"

      - name: Commit if the data changed
        run: |
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "No change in data/"
            exit 0
          fi
          git config user.name  "isl-hud-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh league fixtures ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

    

